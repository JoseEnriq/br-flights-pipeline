version: 2

sources:
  - name: raw
    schema: br_flights
    description: >
      ANAC VRA files exactly as published, loaded by pipeline/ingest.py and
      declared in athena/raw_vra.sql. Every column is text.
    tables:
      - name: raw_vra
        description: >
          One row per flight leg. Partitioned by the month of the published
          file and by the day each new version of that month was loaded.
      - name: raw_anac_stats
        description: >
          ANAC's air transport statistics, one row per airline, route, month,
          nature and flight group since 2000. Loaded by pipeline/ingest_stats.py,
          declared in athena/raw_anac_stats.sql and partitioned by the day each
          new version was loaded.
      - name: raw_anac_punctuality
        description: >
          ANAC's monthly delay and cancellation percentages (Annex I), one row
          per airline, flight number and route, codeshare flight numbers
          included. Loaded by pipeline/ingest_punctuality.py, declared in
          athena/raw_anac_punctuality.sql, partitioned like raw_vra.
