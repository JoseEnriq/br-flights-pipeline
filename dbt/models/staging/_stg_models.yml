version: 2

models:
  - name: stg_flights
    description: >
      One row per flight leg from the latest ingested version of each month,
      with typed columns, real nulls and fully repeated rows removed. Times
      are kept as published by ANAC, without time zone conversion.
    columns:
      - name: airline_icao
        description: ICAO code of the airline (ICAO Empresa Aérea).
        data_tests:
          - not_null
      - name: flight_number
        description: Flight number; unscheduled flights mostly start with Z (Número Voo).
        data_tests:
          - not_null
      - name: authorization_code
        description: Authorization digit of the leg (Código Autorização (DI)).
        data_tests:
          - not_null
      - name: line_type
        description: >
          Route type (Código Tipo Linha). Assumed meaning, since ANAC publishes
          no dictionary: N domestic, C domestic cargo, I international,
          G international cargo. Rarer codes, kept as published: L, R and E
          until January 2020; X from April 2020 to October 2021, the same
          months as the NÃO INFORMADO status; NA since December 2020, mostly
          from April to July 2025.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['N', 'C', 'I', 'G', 'L', 'R', 'E', 'X', 'NA']
      - name: origin_icao
        description: ICAO code of the origin airport (ICAO Aeródromo Origem).
        data_tests:
          - not_null
      - name: destination_icao
        description: ICAO code of the destination airport (ICAO Aeródromo Destino).
        data_tests:
          - not_null
      - name: scheduled_departure
        description: Scheduled departure (Partida Prevista); empty for flights outside the schedule.
      - name: actual_departure
        description: Actual departure (Partida Real); empty for cancelled flights.
      - name: scheduled_arrival
        description: Scheduled arrival (Chegada Prevista).
      - name: actual_arrival
        description: Actual arrival (Chegada Real).
      - name: flight_status
        description: >
          Flight status as published (Situação Voo). NÃO INFORMADO appears
          from April 2020 to October 2021, always on scheduled flights with
          no actual times.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['REALIZADO', 'CANCELADO', 'NÃO INFORMADO']
      - name: justification_code
        description: >
          Delay or cancellation reason (Código Justificativa). Filled until
          January 2020, for every cancellation and about a third of the
          operated flights; empty since April 2020.
      - name: ingestion_date
        description: Day the source version of this month was loaded into the raw layer.
        data_tests:
          - not_null
      - name: month
        description: Month of the published ANAC file, YYYY-MM. Partition column.
        data_tests:
          - not_null

  - name: stg_route_stats
    description: >
      ANAC's air transport statistics from the latest ingested version, one row
      per airline, route, month, nature and flight group, with the columns that
      name airlines and airports. Empty text becomes null.
    columns:
      - name: airline_icao
        description: ICAO code of the airline, the same code the VRA uses (EMPRESA_SIGLA).
        data_tests:
          - not_null
      - name: airline_name
        description: Airline name as registered with ANAC (EMPRESA_NOME).
      - name: airline_nationality
        description: BRASILEIRA or ESTRANGEIRA (EMPRESA_NACIONALIDADE).
      - name: report_year
        data_tests:
          - not_null
      - name: report_month
        data_tests:
          - not_null
      - name: origin_icao
        description: Origin airport; empty in a few rows from the early 2000s (AEROPORTO_DE_ORIGEM_SIGLA).
      - name: origin_city
        description: City the origin airport serves, which ANAC publishes as the airport name.
      - name: ingestion_date
        data_tests:
          - not_null

  - name: stg_punctuality
    description: >
      ANAC's published delay and cancellation percentages (Annex I) from the
      latest version of each month, one row per airline, flight number and
      route. Codeshare flight numbers are included, so a route can appear
      several times with the same flights.
    columns:
      - name: airline_icao
        description: Code before " - " in Empresa_Aerea.
        data_tests:
          - not_null
      - name: flight_number
        data_tests:
          - not_null
      - name: scheduled_flights
        description: Scheduled legs in the month (Etapas_Previstas).
        data_tests:
          - not_null
      - name: pct_cancelled
        description: Cancelled over scheduled, in percent, rounded to 2 decimals.
      - name: pct_delayed_30
        description: Arrived more than 30 minutes late over scheduled flights that operated, in percent.
      - name: pct_delayed_60
        description: Same as pct_delayed_30, with 60 minutes.
      - name: month
        data_tests:
          - not_null
