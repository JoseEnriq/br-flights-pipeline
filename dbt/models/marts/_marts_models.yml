version: 2

models:
  - name: dim_date
    description: One row per calendar day, from the start of the backfill to 2030.
    columns:
      - name: date_day
        description: The day.
        data_tests:
          - unique
          - not_null
      - name: year_month
        description: Year and month as YYYY-MM.
      - name: day_of_week
        description: ISO day of the week, Monday 1 to Sunday 7.
      - name: is_weekend
        description: Saturday or Sunday.

  - name: fct_flights
    description: >
      One row per flight: airline, flight number, origin and scheduled
      departure, or the actual departure for flights outside the schedule.
      Rows that ANAC repeats by pairing every scheduled time with every actual
      time are reduced to the closest pair.
    columns:
      - name: flight_id
        description: Hash of the flight key.
        data_tests:
          - unique
          - not_null
      - name: airline_icao
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airline')
                field: airline_icao
      - name: flight_number
        data_tests:
          - not_null
      - name: origin_icao
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_icao
      - name: destination_icao
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_icao
      - name: flight_date
        description: Date of the scheduled departure, or of the actual one for unscheduled flights.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: departure_delay_minutes
        description: Actual minus scheduled departure; empty without both times.
      - name: arrival_delay_minutes
        description: Actual minus scheduled arrival; empty without both times.
      - name: is_scheduled
        description: The flight was in the schedule (has a scheduled departure).
        data_tests:
          - not_null
      - name: is_cancelled
        data_tests:
          - not_null
      - name: is_return_to_origin
        description: >
          Origin and destination are the same airport: the aircraft took off
          and came back. Almost all carry authorization code 3.
        data_tests:
          - not_null
      - name: is_delayed_30
        description: >
          Arrived more than 30 minutes after the scheduled arrival, ANAC's
          definition. Only for scheduled flights that operated, empty otherwise.
      - name: is_delayed_60
        description: Same as is_delayed_30, with 60 minutes.
      - name: month
        description: Month of the published ANAC file, YYYY-MM. Partition column.
        data_tests:
          - not_null

  - name: dim_airline
    description: >
      One row per airline, named by the latest month it appears in ANAC's
      statistics. Airlines that fly but are missing there keep an empty name.
    columns:
      - name: airline_icao
        data_tests:
          - unique
          - not_null
      - name: airline_name
      - name: airline_nationality
        description: BRASILEIRA or ESTRANGEIRA, as ANAC publishes it.
      - name: is_brazilian

  - name: dim_airport
    description: >
      One row per airport, described by the latest month it appears in ANAC's
      statistics. Airports that appear in flights but are missing there keep
      empty attributes.
    columns:
      - name: airport_icao
        data_tests:
          - unique
          - not_null
      - name: city
        description: City the airport serves; ANAC publishes it as the airport name.
      - name: state
        description: Brazilian state (UF); empty abroad.
      - name: region
        description: Brazilian region; empty abroad.
      - name: country
      - name: continent
      - name: is_brazilian

  - name: agg_route_punctuality
    description: >
      Punctuality by month, airline and route, for scheduled flights, with the
      names from the dimensions. Rates follow ANAC: cancellations over
      scheduled flights, delays over the scheduled flights that operated.
      Keep the counts to add months or routes together; never average rates.
    columns:
      - name: scheduled_flights
        data_tests:
          - not_null
      - name: cancellation_rate
        description: cancelled_flights / scheduled_flights, from 0 to 1.
      - name: delay_30_rate
        description: delayed_30_flights / operated_flights, from 0 to 1; empty when nothing operated.
      - name: median_arrival_delay_minutes
        description: Approximate median of the arrival delay of the flights that operated.
      - name: month
        data_tests:
          - not_null

  - name: audit_anac_reconciliation
    description: >
      Month by month comparison with ANAC's published percentages (Annex I),
      by airline, flight number and route. Codeshare flight numbers exist only
      on ANAC's side and stay out of the match rate.
    columns:
      - name: month
        data_tests:
          - unique
          - not_null
      - name: flight_routes_in_both
        description: Airline, flight number and route combinations present on both sides.
      - name: flight_routes_matching
        description: Same scheduled count and every percentage within 0.01 point.
      - name: match_rate
        description: flight_routes_matching / flight_routes_in_both.
      - name: flight_routes_only_anac
        description: Mostly codeshare flight numbers, which the flight files do not carry.
      - name: flight_routes_only_ours
        description: Flights in ANAC's flight files that its percentages leave out.
