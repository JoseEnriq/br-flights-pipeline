br_flights:
  target: dev
  outputs:
    dev:
      type: athena
      region_name: us-east-1
      database: awsdatacatalog
      schema: br_flights
      work_group: br-flights
      # Query results share the workgroup's prefix, which expires in 7 days.
      # The workgroup must not override client-side settings: when it does,
      # Athena ignores each model's external_location and writes the tables
      # under this expiring prefix too.
      s3_staging_dir: "s3://{{ env_var('LAKE_BUCKET') }}/_athena-results/"
      threads: 4
